[package]
name         = "meta-signal-orchestrate"
version      = "0.13.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-orchestrate"
description  = "Meta signal contract for Orchestrate Nexus configuration."
publish      = false

[lib]
name = "meta_signal_orchestrate"
path = "src/lib.rs"

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "317a77134208" }
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "e448736972a3ac30ce94c4e9c81f299fbe894be9" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[dev-dependencies]
# ethos-zero dev dep removed for now — regeneration test will be updated when ethos-zero integrates

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
